name: Scrape Filer Metadata

on:
  schedule:
    # Run weekly on Sundays at 08:00 UTC (Sun 1 AM PST)
    - cron: "0 8 * * 0"
  workflow_dispatch:
    inputs:
      max_filers:
        description: "Max filers per batch (0 = all uncached)"
        required: false
        default: "500"
      force:
        description: "Force re-scrape even if cached"
        required: false
        default: "false"

permissions:
  contents: write
  actions: write          # needed to retrigger itself

# Shares the data-pipeline lane with the other scrapers. Without this it could
# run alongside them, and since every one of them commits and pushes to data/,
# two at once means a rejected push — or worse, a job that scrapes for an hour
# and then loses its results at the very last step.
concurrency:
  group: data-pipeline
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scraper/requirements.txt

      - name: Install Python dependencies
        run: pip install -r scraper/requirements.txt

      - name: Install Playwright browser + system dependencies
        run: python -m playwright install chromium --with-deps

      - name: Install Xvfb (virtual display for headed browser)
        run: sudo apt-get install -y xvfb

      - name: Scrape filer metadata (party, office, type)
        id: scrape
        run: |
          MAX="${{ github.event.inputs.max_filers || '500' }}"
          FORCE="${{ github.event.inputs.force || 'false' }}"
          ARGS=""
          if [ "$MAX" != "0" ]; then
            ARGS="$ARGS --max-filers $MAX"
          fi
          if [ "$FORCE" = "true" ]; then
            ARGS="$ARGS --force"
          fi
          xvfb-run --auto-servernum python scraper/fetch_filer_metadata.py $ARGS
          # Capture remaining count directly from the file the scraper just wrote
          REMAINING=$(cat data/filer_metadata_remaining.txt 2>/dev/null || echo "0")
          echo "remaining=$REMAINING" >> "$GITHUB_OUTPUT"

      - name: Re-aggregate with updated metadata
        if: always()
        run: python scraper/process.py
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_STORAGE_BUCKET: exports

      - name: Commit and push updated data
        if: always()
        run: |
          bash scripts/push_data.sh "chore: update filer metadata $(date -u +%Y-%m-%d)" data/ docs/data/

      - name: Check if more filers remain and retrigger
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Use the remaining count captured BEFORE git operations (immune to rebase)
          REMAINING="${{ steps.scrape.outputs.remaining }}"
          echo "Filers remaining: $REMAINING"
          if [ -n "$REMAINING" ] && [ "$REMAINING" -gt 0 ] 2>/dev/null; then
            echo "Retriggering workflow for next batch..."
            gh workflow run filer-metadata.yml \
              -f max_filers="${{ github.event.inputs.max_filers || '500' }}" \
              -f force="false"
            echo "Retrigger dispatched."
          else
            echo "All filers scraped — no retrigger needed."
          fi
