name: Donor Entity Resolution (weekly)

# Rebuilds the master donors/donor_aliases tables from scratch and restamps
# transactions.donor_id, applying admin review decisions as must/cannot-link
# constraints. Runs on CI's clean network (bulk writes fail on flaky links).
# The daily refresh only does fast incremental alias assignment between runs.

on:
  schedule:
    # Sundays 12:00 UTC — after the filer-metadata refresh (08:00) so the
    # committee namespace is current.
    - cron: "0 12 * * 0"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-pipeline
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_COPY_CHUNK: "50000"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scraper/requirements.txt

      - name: Install Python dependencies
        run: pip install -r scraper/requirements.txt

      - name: Apply migrations (idempotent)
        run: python scraper/db_admin.py apply

      - name: Run full donor resolution
        run: python scraper/resolve_donors.py --full

      - name: Commit refreshed review queue
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/review_queue.json
          git diff --cached --quiet || git commit -m "chore: weekly donor resolution $(date -u +%Y-%m-%d)"
          for attempt in 1 2 3 4 5; do
            git pull --rebase -X ours && git push && break
            echo "Push attempt $attempt failed, retrying in $((attempt * 15))s..."
            sleep $((attempt * 15))
          done
