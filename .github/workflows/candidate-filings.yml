name: Candidate Filings (weekly)

# Scrapes ORESTAR's Candidate Filing Search for the legislative ballot roster,
# then rebuilds the Races map from it. Committees self-report "Election/Office"
# inconsistently, so the filing record — not the committee — decides who appears
# in a race. Auto-advances primary -> general as nominations post.
#
# Must run HEADED under xvfb: ORESTAR's F5 bot defense blocks headless Chromium.

on:
  schedule:
    - cron: "30 13 * * 1"     # Mondays 06:30 PT
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-pipeline
  cancel-in-progress: false

jobs:
  filings:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scraper/requirements.txt

      - name: Install Python dependencies
        run: pip install -r scraper/requirements.txt

      - name: Install Playwright chromium + system dependencies
        run: python -m playwright install chromium --with-deps

      - name: Install Xvfb (headed browser required — headless is blocked)
        run: sudo apt-get install -y xvfb

      - name: Scrape candidate filings
        run: xvfb-run --auto-servernum python scraper/fetch_candidates.py

      - name: Rebuild Races map from the roster
        run: python scraper/refresh_legislative_map.py

      - name: Commit roster
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/candidate_filings.json
          git diff --cached --quiet || git commit -m "chore: candidate filing roster $(date -u +%Y-%m-%d)"
          for attempt in 1 2 3 4 5; do
            GIT_TERMINAL_PROMPT=0 timeout 300 git -c core.editor=true pull --rebase -X ours && GIT_TERMINAL_PROMPT=0 timeout 300 git push && break
            echo "Push attempt $attempt failed, retrying in $((attempt * 15))s..."
            sleep $((attempt * 15))
          done
