name: Candidate Filings (weekly)

# Scrapes ORESTAR's Candidate Filing Search for the legislative ballot roster,
# then rebuilds the Races map from it. Committees self-report "Election/Office"
# inconsistently, so the filing record — not the committee — decides who appears
# in a race. Auto-advances primary -> general as nominations post.
#
# Must run HEADED under xvfb: ORESTAR's F5 bot defense blocks headless Chromium.

on:
  schedule:
    - cron: "30 13 * * 1"     # Mondays 06:30 PT
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-pipeline
  cancel-in-progress: false

jobs:
  filings:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # Never let two ORESTAR scrapers run at once — see
      # .github/actions/await-orestar for why this is a runtime check rather
      # than a concurrency group or a schedule gap.
      - name: Wait for other ORESTAR jobs
        uses: ./.github/actions/await-orestar
        with:
          # This job's own timeout is 40 minutes, so it cannot afford the
          # default 45-minute wait — it would spend its entire budget queueing
          # and be killed before doing any work, which is exactly what happened
          # on 4 August. 25 leaves ample room for a job whose real work takes
          # about two minutes.
          max-wait-minutes: "25"

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scraper/requirements.txt

      - name: Install Python dependencies
        run: pip install -r scraper/requirements.txt

      - name: Install Playwright chromium + system dependencies
        # Bounded and retried: a hung install held the ORESTAR lane for 3 hours
        # against the job's 300-minute timeout. 18 minutes is the backstop for
        # the script's own 3 x 300s cap.
        timeout-minutes: 25
        run: bash scripts/install_playwright.sh

      - name: Install Xvfb (headed browser required — headless is blocked)
        run: sudo apt-get install -y xvfb

      - name: Scrape candidate filings
        run: xvfb-run --auto-servernum python scraper/fetch_candidates.py

      - name: Rebuild Races map from the roster
        run: python scraper/refresh_legislative_map.py

      - name: Commit roster
        run: |
          bash scripts/push_data.sh "chore: candidate filing roster $(date -u +%Y-%m-%d)" data/candidate_filings.json
