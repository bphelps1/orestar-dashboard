name: Historical Backfill (one-time)

on:
  workflow_dispatch:
    inputs:
      start_year:
        description: "Start year for backfill"
        required: false
        default: "2006"
        type: string
      end_year:
        description: "End year for backfill (blank = current year)"
        required: false
        default: ""
        type: string
      end_date:
        description: "Internal: frozen end date for a chained filer remediation (YYYY-MM-DD)"
        required: false
        default: ""
        type: string
      date_field:
        description: "Date field to search by: 'filed' (default) or 'tran' (transaction date, needed for pre-2017 data)"
        required: false
        default: "tran"
        type: string
      filer_ids:
        description: "Space-separated filer IDs, 'auto' to backfill all discrepancies, or blank for date-range mode"
        required: false
        default: ""
        type: string
      chain_index:
        description: "Internal: which run of the retrigger chain this is"
        required: false
        default: "1"
      reset_auto:
        description: "Reset auto-backfill tracking (clears the list of already-backfilled filers)"
        required: false
        default: "false"
        type: boolean
      identity_remediation:
        description: "Force fresh exact exports for filer IDs (bypasses count/held shortcuts)"
        required: false
        default: "false"
        type: boolean
      resume_auto:
        description: "Internal: explicit filer IDs belong to the automatic identity-remediation chain"
        required: false
        default: "false"
        type: boolean
      verification_filer_ids:
        description: "Internal: immutable original filer set for final identity verification"
        required: false
        default: ""
        type: string

permissions:
  contents: write
  actions: write

# Backfill belongs with the other ORESTAR scrapers, not with the aggregation
# pipeline. It sat in data-pipeline alongside daily-refresh, and because GitHub
# keeps only ONE pending run per lane, a long backfill chain re-claiming that
# lane every run would cancel a queued daily refresh outright rather than delay
# it — the way a scheduled Candidate Filings run was evicted with zero jobs
# recorded.
#
# In orestar-scrape it coordinates through the await-orestar check instead: a
# runtime question about what is actually running, which delays rather than
# evicts, and which every ORESTAR job honours.
concurrency:
  group: orestar-scrape
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # Backfill is the heaviest ORESTAR consumer of the lot — it walks years of
      # weekly windows — so it must take its turn like everything else. It was
      # missed when this check was introduced, which also meant the other four
      # never waited for IT.
      - name: Wait for other ORESTAR jobs
        uses: ./.github/actions/await-orestar
        with:
          fail-on-timeout: "true"

      - name: Refresh branch after coordination wait
        # Checkout happens before the wait because the wait action is local.
        # Another scraper may push ledger/data changes while this job waits;
        # starting from the pre-wait snapshot would resurrect those old files
        # when push_data.sh replays our whole-file changes.
        run: |
          git fetch --depth=1 origin "$GITHUB_REF_NAME"
          git reset --hard FETCH_HEAD

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scraper/requirements.txt

      - name: Install Python dependencies
        run: pip install -r scraper/requirements.txt

      - name: Install Playwright browser + system dependencies
        # Bounded and retried: a hung install held the ORESTAR lane for 3 hours
        # against the job's 300-minute timeout. 18 minutes is the backstop for
        # the script's own 3 x 300s cap.
        timeout-minutes: 25
        run: bash scripts/install_playwright.sh

      - name: Install Xvfb (virtual display for headed browser)
        run: sudo apt-get install -y xvfb

      - name: Resolve filer IDs (auto mode)
        id: resolve
        run: |
          FILER_IDS="${{ inputs.filer_ids }}"
          IDENTITY_MODE="${{ inputs.identity_remediation }}"
          IS_AUTO="${{ inputs.resume_auto }}"
          IDENTITY_RESUME=false
          IDENTITY_END_DATE="${{ inputs.end_date }}"
          VERIFICATION_IDS="${{ inputs.verification_filer_ids }}"
          CHAIN="${{ inputs.chain_index || '1' }}"
          if [ "$CHAIN" = "1" ]; then
            # The first run defines the immutable verification scope. Ignore
            # any stale/internal value supplied by a manual dispatch.
            VERIFICATION_IDS=""
          fi
          if [ "${{ inputs.reset_auto }}" = "true" ]; then
            echo "Resetting auto-backfill tracking file..."
            rm -f data/backfilled_filers.txt
          fi
          if [ "$FILER_IDS" = "auto" ]; then
            echo "Auto mode: finding filers with discrepancies..."
            python3 scraper/auto_backfill_ids.py
            AUTO_MODE=$(cat /tmp/auto_backfill_mode.txt 2>/dev/null || echo count)
            if [ "$AUTO_MODE" = "identity" ]; then
              IDENTITY_MODE=true
              IDENTITY_RESUME=$(cat /tmp/auto_backfill_resume.txt 2>/dev/null || echo false)
              AUTO_END_DATE=$(cat /tmp/auto_backfill_end_date.txt 2>/dev/null || true)
              if [ -n "$AUTO_END_DATE" ]; then
                IDENTITY_END_DATE="$AUTO_END_DATE"
              fi
            else
              IDENTITY_MODE=false
            fi
            IS_AUTO=true
            if [ -f /tmp/auto_backfill_ids.txt ]; then
              FILER_IDS=$(cat /tmp/auto_backfill_ids.txt)
            else
              FILER_IDS=""
            fi
            if [ -z "$FILER_IDS" ]; then
              echo "All discrepancies backfilled."
              echo "resolved=" >> "$GITHUB_OUTPUT"
              echo "is_auto=true" >> "$GITHUB_OUTPUT"
              echo "identity_mode=$IDENTITY_MODE" >> "$GITHUB_OUTPUT"
              echo "identity_resume=$IDENTITY_RESUME" >> "$GITHUB_OUTPUT"
              echo "identity_end_date=$IDENTITY_END_DATE" >> "$GITHUB_OUTPUT"
              echo "verification_ids=$VERIFICATION_IDS" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Auto-resolved filer IDs: $FILER_IDS"
            echo "resolved=$FILER_IDS" >> "$GITHUB_OUTPUT"
            echo "is_auto=true" >> "$GITHUB_OUTPUT"
          else
            echo "resolved=$FILER_IDS" >> "$GITHUB_OUTPUT"
            echo "is_auto=$IS_AUTO" >> "$GITHUB_OUTPUT"
            if [ "$IDENTITY_MODE" = "true" ] && [ "$CHAIN" -gt 1 ] 2>/dev/null; then
              IDENTITY_RESUME=true
            fi
          fi
          if [ -z "$VERIFICATION_IDS" ] && [ "$IDENTITY_MODE" = "true" ]; then
            VERIFICATION_IDS="$FILER_IDS"
          fi
          if [ "$IDENTITY_MODE" = "true" ]; then
            for fid in $FILER_IDS; do
              case " $VERIFICATION_IDS " in
                *" $fid "*) ;;
                *) echo "Current filer $fid is absent from verification scope"; exit 1 ;;
              esac
            done
          fi
          echo "identity_mode=$IDENTITY_MODE" >> "$GITHUB_OUTPUT"
          echo "identity_resume=$IDENTITY_RESUME" >> "$GITHUB_OUTPUT"
          echo "identity_end_date=$IDENTITY_END_DATE" >> "$GITHUB_OUTPUT"
          echo "verification_ids=$VERIFICATION_IDS" >> "$GITHUB_OUTPUT"

      # Gated on "auto mode found nothing", NOT on "no filer ids given".
      #
      # This workflow does two different jobs: a filer-targeted backfill and a
      # window backfill across a year range. The script below already handled
      # both, but every step required a non-empty resolved filer list, so the
      # window branch could never execute. Dispatching it with year inputs
      # skipped all real work and still went green — 2016 was requested, the
      # run reported success, and not a single row was fetched.
      - name: Backfill ORESTAR data
        id: fetch
        if: (steps.resolve.outputs.resolved != '' || steps.resolve.outputs.is_auto != 'true')
        env:
          # Read-only use: the fetcher asks how many rows we already hold for a
          # window so it can skip downloading one we have in full. ORESTAR
          # reports the true count on the results page, so one search settles it
          # — and skipping the export is what makes the request budget go far
          # enough to matter. Without this the step simply downloads everything,
          # as it did before.
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          FILER_IDS="${{ steps.resolve.outputs.resolved }}"
          if [ -n "$FILER_IDS" ]; then
            echo "Filer-targeted backfill: $FILER_IDS"
            ARGS="--filer-ids $FILER_IDS --start-year=${{ inputs.start_year }}"
            if [ "${{ steps.resolve.outputs.identity_mode }}" = "true" ]; then
              END_DATE="${{ steps.resolve.outputs.identity_end_date }}"
              if [ -z "$END_DATE" ]; then
                END_DATE=$(date -u +%F)
              fi
              ARGS="$ARGS --identity-remediation --end-date=$END_DATE"
              echo "end_date=$END_DATE" >> "$GITHUB_OUTPUT"
              if [ "${{ steps.resolve.outputs.identity_resume }}" != "true" ]; then
                ARGS="$ARGS --reset-identity-progress"
              fi
            fi
            set -o pipefail
            xvfb-run --auto-servernum python scraper/fetch.py $ARGS 2>&1 | tee /tmp/backfill.log
            RESULT=$(grep '^REMEDIATION_RESULT ' /tmp/backfill.log | tail -1 || true)
            PROGRESS=0
            RETRY=0
            for KV in $RESULT; do
              case "$KV" in
                progress=*) PROGRESS=${KV#progress=} ;;
                retry=*)    RETRY=${KV#retry=} ;;
              esac
            done
            echo "progress=$PROGRESS" >> "$GITHUB_OUTPUT"
            echo "retry=$RETRY" >> "$GITHUB_OUTPUT"
          else
            ARGS="--mode=backfill --start-year=${{ inputs.start_year }} --date-field=${{ inputs.date_field }}"
            if [ -n "${{ inputs.end_year }}" ]; then
              ARGS="$ARGS --end-year=${{ inputs.end_year }}"
            fi
            xvfb-run --auto-servernum python scraper/fetch.py $ARGS
            echo "progress=0" >> "$GITHUB_OUTPUT"
            echo "retry=0" >> "$GITHUB_OUTPUT"
            echo "end_date=" >> "$GITHUB_OUTPUT"
          fi

      - name: Track successfully backfilled filers (auto mode)
        if: "!cancelled() && steps.resolve.outputs.is_auto == 'true' && steps.resolve.outputs.resolved != ''"
        run: |
          # Mark done ONLY what the scraper reports it actually finished.
          #
          # This used to walk the REQUESTED filer list and tick off anything not
          # named in incomplete_backfills.txt. That is wrong whenever the run
          # stops early: fetch.py breaks out of the filer loop after two
          # consecutive failures, and the filers it never reached appear in
          # neither list — so they were marked backfilled without a single
          # request being made for them. A ten-filer batch that stopped after
          # three recorded all ten as done.
          #
          # It is not a hypothetical. 3,639 of the 4,128 filers on the tracking
          # list have no downloaded file at all, and filer 4572 — marked done,
          # nothing on disk — turned out to be 9,031 rows short of ORESTAR for
          # 2023 alone.
          TRACKING_FILE="data/backfilled_filers.txt"
          COMPLETED_FILE="data/completed_backfills.txt"
          touch "$TRACKING_FILE"
          if [ ! -f "$COMPLETED_FILE" ]; then
            echo "No completed_backfills.txt — the fetch step recorded nothing as finished."
            echo "Marking nothing done; every requested filer will be retried."
            exit 0
          fi
          while read -r fid; do
            [ -z "$fid" ] && continue
            grep -qx "$fid" "$TRACKING_FILE" || echo "$fid" >> "$TRACKING_FILE"
            echo "  ✓ Tracked filer $fid"
          done < "$COMPLETED_FILE"
          requested=$(echo "${{ steps.resolve.outputs.resolved }}" | wc -w)
          finished=$(grep -c . "$COMPLETED_FILE" || true)
          echo "Finished $finished of $requested requested filers; the rest stay queued."

      - name: Check remaining windows
        id: remaining
        if: (steps.resolve.outputs.resolved != '' || steps.resolve.outputs.is_auto != 'true')
        run: |
          FILER_IDS="${{ steps.resolve.outputs.resolved }}"
          if [ -n "$FILER_IDS" ]; then
            echo "remaining=filer" >> "$GITHUB_OUTPUT"
          else
            ARGS="--mode=count-remaining --start-year=${{ inputs.start_year }} --date-field=${{ inputs.date_field }}"
            if [ -n "${{ inputs.end_year }}" ]; then
              ARGS="$ARGS --end-year=${{ inputs.end_year }}"
            fi
            remaining=$(python scraper/fetch.py $ARGS)
            echo "Remaining unfetched windows: $remaining"
            echo "remaining=$remaining" >> "$GITHUB_OUTPUT"
          fi

      - name: Process data
        id: process
        if: (steps.resolve.outputs.resolved != '' || steps.resolve.outputs.is_auto != 'true')
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_STORAGE_BUCKET: exports
        run: |
          FILER_IDS="${{ steps.resolve.outputs.resolved }}"
          REMAINING="${{ steps.remaining.outputs.remaining }}"
          if [ -n "$FILER_IDS" ]; then
            # Filer-targeted: merge only (daily refresh will aggregate)
            python scraper/process.py --merge-only
          elif [ "$REMAINING" = "0" ]; then
            # Final date-range batch: full aggregation
            echo "Final batch — running full aggregation..."
            python scraper/process.py
            # After the last batch is merged, reload the full transactions
            # table so Postgres exactly mirrors the year shards.
            python scraper/process.py --supabase-full-load
          else
            # Intermediate date-range batch: merge only
            echo "Intermediate batch ($REMAINING windows remaining) — merge only..."
            python scraper/process.py --merge-only
          fi

      - name: Commit and push backfill data
        if: >-
          !cancelled() &&
          (steps.resolve.outputs.resolved != '' || steps.resolve.outputs.is_auto != 'true') &&
          (steps.resolve.outputs.identity_mode != 'true' || steps.process.outcome == 'success')
        run: |
          # Dashboard reads aggregates from Supabase now — only version data/.
          FILER_IDS="${{ steps.resolve.outputs.resolved }}"
          IS_AUTO="${{ steps.resolve.outputs.is_auto }}"
          if [ "$IS_AUTO" = "true" ]; then
            MSG="chore: auto-backfill filers $FILER_IDS"
          elif [ -n "$FILER_IDS" ]; then
            MSG="chore: backfill filers $FILER_IDS"
          else
            MSG="chore: backfill ${{ inputs.date_field }}-date ${{ inputs.start_year }}–${{ inputs.end_year || 'now' }}"
          fi
          bash scripts/push_data.sh "$MSG" data/

      # success(), not !cancelled(): cancelling a run used to fire this step
      # anyway, so stopping a runaway chain meant disabling the workflow.
      - name: Re-trigger if backfill incomplete
        if: ${{ success() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          IS_AUTO="${{ steps.resolve.outputs.is_auto }}"
          FILER_IDS="${{ steps.resolve.outputs.resolved }}"
          IDENTITY_MODE="${{ steps.resolve.outputs.identity_mode }}"

          if [ "$IS_AUTO" = "true" ] && [ -z "$FILER_IDS" ]; then
            echo "Auto backfill complete — all discrepancies addressed."
            exit 0
          fi

          # Every targeted mode first proves which requested filers actually
          # drained their fetch queues. Identity remediation additionally uses
          # freshly-validated window progress, so a large filer can advance
          # across runners even when no whole filer finishes in one run.
          if [ -n "$FILER_IDS" ]; then
            COMPLETED_FILE="data/completed_backfills.txt"
            REMAIN=""
            for fid in $FILER_IDS; do
              if [ -f "$COMPLETED_FILE" ] && grep -qx "$fid" "$COMPLETED_FILE"; then
                continue
              fi
              REMAIN="$REMAIN $fid"
            done
            REMAIN=$(echo "$REMAIN" | xargs || true)

            if [ "$IDENTITY_MODE" = "true" ]; then
              if [ -z "$REMAIN" ]; then
                echo "Fresh exports complete; dispatching an exact identity verification."
                bash scripts/dispatch_retry.sh coverage-diff.yml --ref "${{ github.ref_name }}" \
                  -f filer_ids="${{ steps.resolve.outputs.verification_ids }}" \
                  -f start_year="${{ inputs.start_year }}" \
                  -f recheck=true \
                  -f require_no_missing=true \
                  -f resume_auto_backfill="$IS_AUTO"
                exit 0
              fi
              CHAIN="${{ github.event.inputs.chain_index || '1' }}"
              if [ "$CHAIN" -ge 40 ] 2>/dev/null; then
                echo "Identity-remediation chain limit reached ($CHAIN): $REMAIN"
                exit 0
              fi
              if [ "${{ steps.fetch.outputs.progress }}" = "0" ] && \
                 [ "${{ steps.fetch.outputs.retry }}" != "1" ]; then
                echo "This forced run validated no new windows — stopping the chain."
                echo "Still unfinished: $REMAIN"
                exit 0
              fi
              NEXT=$((CHAIN + 1))
              echo "Chaining forced run $NEXT for: $REMAIN"
              bash scripts/dispatch_retry.sh backfill.yml --ref "${{ github.ref_name }}" \
                -f filer_ids="$REMAIN" \
                -f start_year="${{ inputs.start_year }}" \
                -f date_field="${{ inputs.date_field }}" \
                -f identity_remediation=true \
                -f resume_auto="$IS_AUTO" \
                -f end_date="${{ steps.fetch.outputs.end_date }}" \
                -f verification_filer_ids="${{ steps.resolve.outputs.verification_ids }}" \
                -f chain_index="$NEXT"
              exit 0
            fi

            # Count-based auto mode keeps its historical batch chain. Exact
            # auto mode never reaches this branch; it alternates fresh fetches
            # with targeted identity diffs instead.
            if [ "$IS_AUTO" = "true" ]; then
              echo "Re-triggering count-based auto backfill for next batch..."
              bash scripts/dispatch_retry.sh backfill.yml --ref "${{ github.ref_name }}" \
                -f filer_ids=auto
              exit 0
            fi

            if [ -z "$REMAIN" ]; then
              echo "Filer-targeted backfill complete — every requested filer finished."
              exit 0
            fi

            CHAIN="${{ github.event.inputs.chain_index || '1' }}"
            if [ "$CHAIN" -ge 40 ] 2>/dev/null; then
              echo "Chain limit reached ($CHAIN) with these still unfinished: $REMAIN"
              exit 0
            fi
            FINISHED=$(echo "$FILER_IDS" | wc -w)
            LEFT=$(echo "$REMAIN" | wc -w)
            if [ "$FINISHED" = "$LEFT" ]; then
              echo "This run finished no filers — stopping rather than queueing an identical run."
              echo "Still unfinished: $REMAIN"
              exit 0
            fi
            NEXT=$((CHAIN + 1))
            echo "Chaining run $NEXT for $LEFT unfinished filer(s): $REMAIN"
            bash scripts/dispatch_retry.sh backfill.yml --ref "${{ github.ref_name }}" \
              -f filer_ids="$REMAIN" \
              -f start_year="${{ inputs.start_year }}" \
              -f date_field="${{ inputs.date_field }}" \
              -f chain_index="$NEXT"
            exit 0
          fi

          # Defensive fallback for auto mode if it ever resolves no list above.
          if [ "$IS_AUTO" = "true" ]; then
            echo "Re-triggering auto backfill for next batch..."
            bash scripts/dispatch_retry.sh backfill.yml --ref "${{ github.ref_name }}" \
              -f filer_ids=auto
            exit 0
          fi

          # Date-range mode: re-trigger if windows remain
          REMAINING="${{ steps.remaining.outputs.remaining }}"
          if [ "$REMAINING" -gt 0 ] 2>/dev/null; then
            echo "Re-triggering backfill workflow..."
            RETRIGGER_ARGS="-f start_year=${{ inputs.start_year }} -f date_field=${{ inputs.date_field }}"
            if [ -n "${{ inputs.end_year }}" ]; then
              RETRIGGER_ARGS="$RETRIGGER_ARGS -f end_year=${{ inputs.end_year }}"
            fi
            # Bounded, like the balances chain. An unbounded chain re-claims its
            # concurrency lane every run, and GitHub keeps only ONE pending run per
            # lane — so anything queued behind it is cancelled outright rather than
            # delayed. Yielding costs nothing: every window fetched is committed, so
            # the next scheduled or manual run picks up exactly where this stopped.
            BATCH="${{ github.event.inputs.chain_index || '1' }}"
            # 40, not 8. The bound is a runaway-loop backstop, not lane
            # rationing — that was the data-pipeline concern and no longer
            # applies. At ~25 fetches per run before ORESTAR throttles, the
            # 2006-2016 remediation is ~26 runs, so 8 stalled it a third of the
            # way through with nothing scheduled to resume: this workflow is
            # dispatch-only, so "yielding" meant abandoning.
            if [ "$BATCH" -ge "${MAX_CHAIN:-40}" ]; then
              echo "Reached ${MAX_CHAIN:-40} chained runs; stopping."
              echo "$REMAINING windows remain — re-run to continue."
              exit 0
            fi
            RETRIGGER_ARGS="$RETRIGGER_ARGS -f chain_index=$((BATCH + 1))"
            bash scripts/dispatch_retry.sh backfill.yml --ref "${{ github.ref_name }}" $RETRIGGER_ARGS
          else
            echo "Backfill complete — all windows fetched."
          fi
