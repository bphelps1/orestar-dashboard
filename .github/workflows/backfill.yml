name: Historical Backfill (one-time)

on:
  workflow_dispatch:
    inputs:
      start_year:
        description: "Start year for backfill"
        required: false
        default: "2006"
        type: string
      end_year:
        description: "End year for backfill (blank = current year)"
        required: false
        default: ""
        type: string
      date_field:
        description: "Date field to search by: 'filed' (default) or 'tran' (transaction date, needed for pre-2017 data)"
        required: false
        default: "tran"
        type: string
      filer_ids:
        description: "Space-separated filer committee IDs to backfill (bypasses date-range mode)"
        required: false
        default: ""
        type: string

permissions:
  contents: write
  actions: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 300   # ~954 windows × ~10s each ≈ 2.5-3 hours

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scraper/requirements.txt

      - name: Install Python dependencies
        run: pip install -r scraper/requirements.txt

      - name: Install Playwright browser + system dependencies
        run: python -m playwright install chromium --with-deps

      - name: Install Xvfb (virtual display for headed browser)
        run: sudo apt-get install -y xvfb

      - name: Backfill ORESTAR data
        run: |
          FILER_IDS="${{ inputs.filer_ids }}"
          if [ -n "$FILER_IDS" ]; then
            echo "Filer-targeted backfill: $FILER_IDS"
            xvfb-run --auto-servernum python scraper/fetch.py --filer-ids $FILER_IDS --start-year=${{ inputs.start_year }}
          else
            ARGS="--mode=backfill --start-year=${{ inputs.start_year }} --date-field=${{ inputs.date_field }}"
            if [ -n "${{ inputs.end_year }}" ]; then
              ARGS="$ARGS --end-year=${{ inputs.end_year }}"
            fi
            xvfb-run --auto-servernum python scraper/fetch.py $ARGS
          fi

      - name: Process data
        run: |
          FILER_IDS="${{ inputs.filer_ids }}"
          if [ -n "$FILER_IDS" ]; then
            # Filer-targeted: merge only (skip aggregation — daily refresh handles it)
            python scraper/process.py --merge-only
          else
            # Full backfill: aggregate everything
            python scraper/process.py
          fi

      - name: Commit and push backfill data
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          FILER_IDS="${{ inputs.filer_ids }}"
          if [ -z "$FILER_IDS" ]; then
            mkdir -p docs/data/aggregated
            cp -r data/aggregated/. docs/data/aggregated/
          fi
          git add data/ docs/data/
          FILER_IDS="${{ inputs.filer_ids }}"
          if [ -n "$FILER_IDS" ]; then
            git diff --cached --quiet || git commit -m "chore: backfill filers $FILER_IDS"
          else
            git diff --cached --quiet || git commit -m "chore: backfill ${{ inputs.date_field }}-date ${{ inputs.start_year }}–${{ inputs.end_year || 'now' }}"
          fi
          for attempt in 1 2 3 4 5; do
            git pull --rebase -X ours && git push && break
            echo "Push attempt $attempt failed, retrying in $((attempt * 15))s..."
            sleep $((attempt * 15))
          done

      - name: Re-trigger if backfill incomplete
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          FILER_IDS="${{ inputs.filer_ids }}"
          if [ -n "$FILER_IDS" ]; then
            echo "Filer-targeted backfill — skipping re-trigger (daily refresh will aggregate)."
            exit 0
          fi
          ARGS="--mode=count-remaining --start-year=${{ inputs.start_year }} --date-field=${{ inputs.date_field }}"
          if [ -n "${{ inputs.end_year }}" ]; then
            ARGS="$ARGS --end-year=${{ inputs.end_year }}"
          fi
          remaining=$(python scraper/fetch.py $ARGS)
          echo "Remaining unfetched windows: $remaining"
          if [ "$remaining" -gt 0 ]; then
            echo "Re-triggering backfill workflow..."
            RETRIGGER_ARGS="-f start_year=${{ inputs.start_year }} -f date_field=${{ inputs.date_field }}"
            if [ -n "${{ inputs.end_year }}" ]; then
              RETRIGGER_ARGS="$RETRIGGER_ARGS -f end_year=${{ inputs.end_year }}"
            fi
            gh workflow run backfill.yml --ref main $RETRIGGER_ARGS
          else
            echo "Backfill complete — all windows fetched."
          fi
