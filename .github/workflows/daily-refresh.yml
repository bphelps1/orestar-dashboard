name: Daily Data Refresh

on:
  schedule:
    # 15:00 UTC = 8:00 AM PST (UTC-7 in summer / UTC-8 in winter)
    - cron: "0 15 * * *"
  workflow_dispatch:  # allow manual trigger from GitHub UI

permissions:
  contents: write

concurrency:
  group: data-pipeline
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    # Headroom for the weekly account-summary refresh, which lands inside one
    # daily run and takes the better part of an hour on its own.
    timeout-minutes: 120

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # Never let two ORESTAR scrapers run at once — see
      # .github/actions/await-orestar for why this is a runtime check rather
      # than a concurrency group or a schedule gap.
      - name: Wait for other ORESTAR jobs
        uses: ./.github/actions/await-orestar

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scraper/requirements.txt

      - name: Install Python dependencies
        run: pip install -r scraper/requirements.txt

      - name: Install Playwright browser + system dependencies
        # Bounded and retried: a hung install held the ORESTAR lane for 3 hours
        # against the job's 300-minute timeout. 18 minutes is the backstop for
        # the script's own 3 x 300s cap.
        timeout-minutes: 18
        run: bash scripts/install_playwright.sh

      - name: Install Xvfb (virtual display for headed browser)
        run: sudo apt-get install -y xvfb

      - name: Check for split-window gaps and repair
        run: python scraper/fetch.py --mode=check-gaps

      - name: Fetch last 14 days from ORESTAR
        run: xvfb-run --auto-servernum python scraper/fetch.py --mode=incremental --days=14

      - name: Process and aggregate data (also syncs to Supabase)
        run: python scraper/process.py
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_STORAGE_BUCKET: exports

      - name: Re-key donor aggregates onto resolved entities
        # process.py rebuilds these blobs from raw names; re-key them so the
        # Donors tab keeps showing merged entities between weekly resolves.
        run: python scraper/refresh_donor_aggregates.py
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_STORAGE_BUCKET: exports

      - name: Commit and push updated data
        run: |
          bash scripts/push_data.sh "chore: daily data refresh $(date -u +%Y-%m-%d)" data/
