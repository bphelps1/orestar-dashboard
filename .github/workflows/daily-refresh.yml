name: Daily Data Refresh

on:
  schedule:
    # 15:00 UTC = 8:00 AM PST (UTC-7 in summer / UTC-8 in winter)
    - cron: "0 15 * * *"
  workflow_dispatch:  # allow manual trigger from GitHub UI

permissions:
  contents: write

concurrency:
  group: data-pipeline
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scraper/requirements.txt

      - name: Install Python dependencies
        run: pip install -r scraper/requirements.txt

      - name: Install Playwright browser + system dependencies
        run: python -m playwright install chromium --with-deps

      - name: Install Xvfb (virtual display for headed browser)
        run: sudo apt-get install -y xvfb

      - name: Check for split-window gaps and repair
        run: python scraper/fetch.py --mode=check-gaps

      - name: Fetch last 14 days from ORESTAR
        run: xvfb-run --auto-servernum python scraper/fetch.py --mode=incremental --days=14

      - name: Process and aggregate data (also syncs to Supabase)
        run: python scraper/process.py
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_STORAGE_BUCKET: exports

      - name: Commit and push updated data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # The dashboard reads aggregates from Supabase now, so we no longer
          # publish the JSON tree to docs/. We still version the per-year
          # transaction shards and scraper state files under data/.
          git add data/
          git diff --cached --quiet || git commit -m "chore: daily data refresh $(date -u +%Y-%m-%d)"
          for attempt in 1 2 3 4 5; do
            GIT_TERMINAL_PROMPT=0 timeout 300 git -c core.editor=true pull --rebase -X ours && GIT_TERMINAL_PROMPT=0 timeout 300 git push && break
            echo "Push attempt $attempt failed, retrying in $((attempt * 15))s..."
            sleep $((attempt * 15))
          done
