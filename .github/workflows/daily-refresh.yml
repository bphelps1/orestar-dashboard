name: Daily Data Refresh

on:
  schedule:
    # 15:00 UTC = 8:00 AM PST (UTC-7 in summer / UTC-8 in winter)
    - cron: "0 15 * * *"
  workflow_dispatch:  # allow manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scraper/requirements.txt

      - name: Install Python dependencies
        run: pip install -r scraper/requirements.txt

      - name: Install Playwright browser + system dependencies
        run: python -m playwright install chromium --with-deps

      - name: Install Xvfb (virtual display for headed browser)
        run: sudo apt-get install -y xvfb

      - name: Fetch last 14 days from ORESTAR
        run: xvfb-run --auto-servernum python scraper/fetch.py --mode=incremental --days=14

      - name: Process and aggregate data
        run: python scraper/process.py

      - name: Commit and push updated data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p docs/data/aggregated
          cp -r data/aggregated/. docs/data/aggregated/
          git add data/ docs/data/
          git diff --cached --quiet || git commit -m "chore: daily data refresh $(date -u +%Y-%m-%d)"
          for attempt in 1 2 3 4 5; do
            git pull --rebase && git push && break
            echo "Push attempt $attempt failed, retrying in $((attempt * 15))s..."
            sleep $((attempt * 15))
          done
