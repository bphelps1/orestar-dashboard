name: Supabase Full Load (one-off)

# Manually-triggered: applies migrations (idempotent), loads all transaction
# shards into Postgres, seeds the dashboard aggregate tables from the committed
# data/aggregated JSON, and uploads the full CSV to Storage. Runs on GitHub's
# clean network so large payloads / COPY streams work at full speed.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: data-pipeline
  cancel-in-progress: false

jobs:
  load:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_STORAGE_BUCKET: exports
      # Large COPY chunks on CI's clean network (local flaky runs override to 500)
      SUPABASE_COPY_CHUNK: "50000"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scraper/requirements.txt

      - name: Install Python dependencies
        run: pip install -r scraper/requirements.txt

      - name: Apply migrations (idempotent)
        run: python scraper/db_admin.py apply

      - name: Load all transactions into Postgres + upload full CSV
        run: python scraper/process.py --supabase-full-load

      - name: Seed dashboard aggregate tables
        run: python scraper/db_admin.py seed-aggregates

      - name: Verify
        run: python scraper/db_admin.py verify
